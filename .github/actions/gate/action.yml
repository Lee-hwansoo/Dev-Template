# =============================================================================
# .github/actions/gate — what every image job does first: the contract suite
# (~15 s, no docker), because a tree that fails it cannot teach us anything
# about an image and the steps after it cost minutes; optionally the disk
# reclaim a full image build needs on a hosted runner.
# =============================================================================
name: contracts gate
description: Run the contract suite before anything expensive; optionally free the runner disk for a full image build.
inputs:
  reclaim-disk:
    description: Remove the preinstalled SDKs (dotnet, android, ghc) a full image build needs the space of.
    default: 'false'
runs:
  using: composite
  steps:
    - name: reclaim runner disk
      if: inputs.reclaim-disk == 'true'
      shell: bash
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc 2>/dev/null || true
    - name: repository contracts
      shell: bash
      run: make verify
