# =============================================================================
# .github/workflows/images.yml — the middle tier, gated on the files that can
# break an image, and kept to two jobs so a commit's check list stays readable.
# Nothing here builds a whole image: every check resolves against a real apt
# index or builds the two cheap stages. The weekly cron covers drift nobody
# pushed (a rotated key, a moved apt package). The jobs that DO build a full
# image live in images-deep.yml, on their own cron and `gh workflow run`.
# =============================================================================
name: images

# The token can read the checkout and nothing else.
permissions:
  contents: read

# The apt manifests are inputs too: an entry added there is installed into the
# ROS image and the prod chain, which project.yml (dev image only) never builds.
on:
  push:
    paths:
      - 'docker/**'
      # config/ and scripts/ are COPYed into every image and sourced by the
      # builder stages, so a change there can break a build that no other
      # trigger covers (the apt helpers were listed alone).
      - 'config/**'
      - 'scripts/**'
      - 'dependencies/apt.txt'
      - 'dependencies/apt_ros.txt'
      - '.github/workflows/images.yml'
  pull_request:
    paths:                       # the same set as push, above
      - 'docker/**'
      - 'config/**'
      - 'scripts/**'
      - 'dependencies/apt.txt'
      - 'dependencies/apt_ros.txt'
      - '.github/workflows/images.yml'
  schedule:
    # Monday 03:00 UTC.
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apt:
    # One job, not ten matrix rows: every check here is a ~40 s container run
    # against a real apt index, and a template's check list should stay readable.
    # Each concern prints its own group and the step names the distro that broke.
    name: apt (ROS keys, CUDA repo, package lists)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # The ROS 1 key import once aborted inside `docker build` for want of
      # /dev/tty while every host test passed — so run it where it failed.
      - name: ROS repo keys land, and apt trusts them
        run: |
          failed=""
          # <base>|<distro>|<package>|<ROS_SNAPSHOT_DATE>
          for case in 'ubuntu:20.04|noetic|ros-noetic-ros-base|latest' \
                      'ubuntu:22.04|humble|ros-humble-ros-base|latest' \
                      'ubuntu:22.04|humble|ros-humble-ros-base|2025-05-16'; do
            IFS='|' read -r image distro package snapshot <<<"$case"
            echo "::group::$distro on $image (snapshot $snapshot)"
            # apt refuses an unsigned or wrongly-signed repository, so a
            # resolvable candidate proves the keyring landed correctly.
            docker run --rm -v "$PWD:/w" -w /w -e DEBIAN_FRONTEND=noninteractive \
              -e ROS_SNAPSHOT_DATE="$snapshot" "$image" bash -c '
                set -e
                apt-get update -qq
                apt-get install -y -qq curl gnupg ca-certificates >/dev/null
                bash scripts/util_apt_helper.sh setup-ros-repo '"$distro"'
                apt-cache policy '"$package"' | tee /dev/stderr | grep -q Candidate:' \
              || failed="$failed $distro@$image($snapshot)"
            echo "::endgroup::"
          done
          [ -z "$failed" ] || { echo "ROS repo key path failed for:$failed"; exit 1; }
      - name: CUDA repo, fingerprint-pinned
        run: |
          docker run --rm -v "$PWD:/w" -w /w -e DEBIAN_FRONTEND=noninteractive \
            ubuntu:22.04 bash -c '
              set -e
              apt-get update -qq
              apt-get install -y -qq curl gnupg ca-certificates >/dev/null
              bash scripts/util_apt_helper.sh setup-cuda-repo 12.4
              apt-cache policy cuda-nvcc-12-4 | grep -q Candidate:'
      # The ROS manifests were written against Humble and inherited by every
      # other distro: `tf2-ros-py` (Galactic+) broke a Foxy build four minutes
      # in. Resolve the full dev selection against each distro's own index.
      - name: every selected ROS package has a candidate on its own distro
        run: |
          failed=""
          # <base>|<distro>|<ROS_SNAPSHOT_DATE>
          for case in 'ubuntu:20.04|foxy|final' \
                      'ubuntu:20.04|noetic|latest' \
                      'ubuntu:22.04|humble|latest' \
                      'ubuntu:24.04|jazzy|latest'; do
            IFS='|' read -r image distro snapshot <<<"$case"
            echo "::group::$distro package selection"
            docker run --rm -v "$PWD:/w" -w /w -e DEBIAN_FRONTEND=noninteractive \
              -e ROS_SNAPSHOT_DATE="$snapshot" -e WORKSPACE_PATH=/w "$image" bash -c '
                set -e
                apt-get update -qq
                apt-get install -y -qq curl gnupg ca-certificates >/dev/null
                bash scripts/util_apt_helper.sh setup-ros-repo '"$distro"' >/dev/null
                apt-get update -qq
                pkgs=$(DEVKIT_DRY_RUN=1 bash scripts/util_apt_helper.sh install-packages all '"$distro"')
                [ "$(wc -w <<< "$pkgs")" -ge 10 ] || { echo "selection collapsed: $pkgs"; exit 1; }
                missing=""
                for p in $pkgs; do
                  apt-cache policy "${p%%=*}" 2>/dev/null | grep -q "Candidate: [^(]" || missing="$missing $p"
                done
                [ -z "$missing" ] || { echo "no candidate:$missing"; exit 1; }
                echo "all $(wc -w <<< "$pkgs") packages resolve"' \
              || failed="$failed $distro"
            echo "::endgroup::"
          done
          [ -z "$failed" ] || { echo "ROS package selection failed for:$failed"; exit 1; }
      # The dev image's apt list is spelled once in the Dockerfile, for three
      # Ubuntu releases the kit advertises. `libgl1-mesa-glx` vanished in 24.04
      # and every jazzy/kilted/rolling build died at dev-base-tools.
      - name: every Dockerfile apt package has a candidate on every base
        run: |
          # Package words of the multi-line `apt-get install` in the stages that
          # every image shares; comment lines inside the RUN are skipped.
          pkgs=$(awk '/^FROM /{s=$NF}
                      (s=="build-core"||s=="dev-base-tools"||s=="prod-base") && /--no-install-recommends \\$/ {grab=1; next}
                      grab && /^ *#/ {next}
                      grab {line=$0; if (line ~ /&&/) {grab=0; sub(/&&.*/, "", line)}; gsub(/\\/, "", line); print line}' \
                 docker/Dockerfile | tr -s ' ' '\n' | grep -v '^$' | sort -u | tr '\n' ' ')
          [ "$(wc -w <<< "$pkgs")" -ge 40 ] || { echo "package extraction collapsed: '$pkgs'"; exit 1; }
          failed=""
          for image in ubuntu:20.04 ubuntu:22.04 ubuntu:24.04; do
            echo "::group::$image"
            docker run --rm -e DEBIAN_FRONTEND=noninteractive -e PKGS="$pkgs" "$image" bash -c '
              apt-get update -qq >/dev/null
              missing=""
              for p in $PKGS; do
                apt-cache policy "$p" 2>/dev/null | grep -q "Candidate: [^(]" || missing="$missing $p"
              done
              [ -z "$missing" ] || { echo "no candidate on this base:$missing"; exit 1; }
              echo "all $(wc -w <<< "$PKGS") packages resolve"' || failed="$failed $image"
            echo "::endgroup::"
          done
          [ -z "$failed" ] || { echo "the Dockerfile apt list does not resolve on:$failed"; exit 1; }

  image-stages:
    name: image stages (base, build-core)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/gate
      # BuildKit layers are cached in the Actions cache (type=gha), one scope
      # per target: an unchanged layer is not rebuilt on the next push.
      - uses: docker/setup-buildx-action@v3
      - name: build the cheap stages
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: build-core
          build-args: |
            BASE_IMAGE=ubuntu:22.04
            ROS_DISTRO=humble
            APT_SNAPSHOT_DATE=latest
            STRICT_GPG_CHECK=true
          tags: devkit-ci:build-core
          load: true
          cache-from: type=gha,scope=build-core
          cache-to: type=gha,mode=max,scope=build-core
      - name: the built image must not carry dead plumbing
        run: |
          docker run --rm --entrypoint bash devkit-ci:build-core -c '
            [ "$BASH_ENV" = /etc/devkit/shell-env.sh ] || { echo "BASH_ENV not wired"; exit 1; }
            [ -z "${SOURCE_LOG:-}" ] || { echo "SOURCE_LOG resurrected"; exit 1; }'
      # The interpreter a baked venv symlinks into must run under a non-root
      # uid. On the real image: the failure was a 0700 directory mode.
      - name: the managed interpreter must run as a non-root uid
        run: |
          docker run --rm --entrypoint bash devkit-ci:build-core -c '
            set -e
            case "${UV_PYTHON_INSTALL_DIR:-}" in
              ""|/root/*) echo "managed python at ${UV_PYTHON_INSTALL_DIR:-<unset>}: no other uid can reach it"; exit 1 ;;
            esac
            # No -type f: uv leaves bin/python3 as a symlink to bin/pythonX.Y.
            PY=$(find "$UV_PYTHON_INSTALL_DIR" -maxdepth 3 -path "*/bin/python3" -print -quit)
            [ -n "$PY" ] || { echo "no managed interpreter under $UV_PYTHON_INSTALL_DIR"; exit 1; }
            su -s /bin/sh nobody -c "$PY -V"'
      # A base image that already uses the requested gid, group name or user name
      # must not abort the build with a raw groupadd error. Proved here against
      # the real shadow-utils; verify_repo.sh runs the same block offline.
      - name: host uid/gid conflicts resolve, or fail naming the cause
        run: |
          docker build --target base -f docker/Dockerfile \
            --build-arg BASE_IMAGE=ubuntu:24.04 --build-arg CONTAINER_USER=user \
            --build-arg USER_UID=501 --build-arg USER_GID=20 -t devkit-ci:macos-ids .
          [ "$(docker run --rm devkit-ci:macos-ids id -u user)" = 501 ] \
            || { echo "a macOS uid/gid pair did not survive the build"; exit 1; }
          rc=0
          docker build --target base -f docker/Dockerfile \
            --build-arg BASE_IMAGE=ubuntu:24.04 --build-arg CONTAINER_USER=ubuntu \
            --build-arg USER_UID=1001 --build-arg USER_GID=1001 \
            -t devkit-ci:clashing-ids . >clash.log 2>&1 || rc=$?
          [ "$rc" -ne 0 ] || { echo "a CONTAINER_USER taken at another uid must fail the build"; exit 1; }
          grep -q 'already exists at uid' clash.log \
            || { echo "the build failed without naming the cause:"; tail -20 clash.log; exit 1; }
