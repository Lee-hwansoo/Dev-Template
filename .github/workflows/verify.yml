# =============================================================================
# .github/workflows/verify.yml — the fast tier, every push and PR. A script or
# doc change must not wait on a container build: this is the contract suite
# plus a BuildKit lint that resolves every stage without building one.
# Anything needing a real image lives in images.yml.
# =============================================================================
name: verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run of the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts + Dockerfile lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The contract suite. Needs neither docker nor .env.
      - run: make verify
      # The docker-build shell has no terminal and no BASH_ENV, and the prod
      # builder stages source config/util_aliases.sh in exactly that shell —
      # a host run passes even when that path is broken.
      - name: container shell bootstrap (no tty, no BASH_ENV)
        run: |
          docker run --rm -v "$PWD:/w:ro" -w /w -e WORKSPACE_PATH=/w ubuntu:22.04 bash -c '
            set -e
            source /w/config/util_aliases.sh
            for fn in mksync cbuild mbuild uvs mkenv log_ok log_detail; do
              declare -F "$fn" >/dev/null || { echo "missing function: $fn"; exit 1; }
            done
            [ -n "$WS_VENV_PY" ] || { echo "WS_VENV_PY unset"; exit 1; }
            log_warn probe 2>&1 | cat -v | grep -q "\^\[" && { echo "ANSI escape in a build log"; exit 1; }
            mkdir -p /tmp/w/install/x && : > /tmp/w/install/x/f
            bash /w/scripts/check_deps.sh /tmp/w/install'
      # --check lints and resolves every stage; nothing is built.
      - name: docker build --check
        run: |
          docker build --check -f docker/Dockerfile \
            --build-arg BASE_IMAGE=ubuntu:22.04 \
            --build-arg ROS_DISTRO=humble .

  # The host half of DevKit runs on the developer's machine, where sed, awk,
  # stat and date are BSD, not GNU. The suite is offline and needs no docker,
  # so the whole host contract is checkable on a real macOS runner for ~1 min.
  macos-host:
    name: macOS host (BSD sed/awk/stat)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: make verify
      # Detection must survive a host with no /sys, no /proc and no docker.
      - name: host detection resolves on macOS
        run: |
          bash scripts/check_env.sh --makefile > env.mk
          grep -q '^IS_MACOS := true' env.mk || { echo "IS_MACOS not detected"; cat env.mk; exit 1; }
          grep -q '^HOST_UID := ' env.mk || { echo "HOST_UID missing"; exit 1; }
          # GPU_MODE is an INPUT, not an emitted key: the Makefile resolves the
          # profile from the three flags below. macOS must land on all-false.
          for flag in 'HAS_NVIDIA := false' 'HAS_TOOLKIT := false' 'HAS_DRI := false'; do
            grep -qF "$flag" env.mk || { echo "expected '$flag' on macOS"; cat env.mk; exit 1; }
          done
          make -n start ENV=ros >/dev/null
      - name: every CLI still answers --help under BSD userland
        run: |
          for s in scripts/*.sh; do
            bash "$s" --help >/dev/null 2>&1 || { echo "$s --help failed on macOS"; exit 1; }
          done
