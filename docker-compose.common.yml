# =============================================================================
# docker-compose.common.yml — the runtime environment and one abstract service
# template per acceleration profile. The ENV split (ros vs dev) lives in
# docker-compose.dev.yml; check [compose-env-split] keeps the two halves joined.
# =============================================================================

# ── Runtime Environment ──────────────────────────────────────────────────────
# The container paths below are also spelled in docker/entrypoint.sh.
x-common-env: &common-env
  COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-myproject}
  CONTAINER_USER: ${CONTAINER_USER:-user}
  WORKSPACE_PATH: ${WORKSPACE_PATH:-/workspace}
  LANG: ${LANG:-C.UTF-8}
  TZ: ${TZ:-UTC}
  LOG_SHOW_TIME: ${LOG_SHOW_TIME:-false}
  DEBUG_MODE: ${DEBUG_MODE:-false}
  LOG_FILE: ${LOG_FILE:-}
  HAS_TOOLKIT: ${HAS_TOOLKIT:-false}
  HAS_NVIDIA: ${HAS_NVIDIA:-false}
  HAS_DRI: ${HAS_DRI:-false}
  GPU_MODE: ${GPU_MODE:-auto}
  OPENCV_CUDA: ${OPENCV_CUDA:-auto}
  # HOST_DISPLAY comes from check_env.sh: on macOS it rewrites the launchd
  # socket path to host.docker.internal:0 (XQuartz); elsewhere it equals DISPLAY.
  DISPLAY: ${HOST_DISPLAY:-${DISPLAY:-:0}}
  DISPLAY_TYPE: ${DISPLAY_TYPE:-X11}
  WAYLAND_DISPLAY: ${HOST_WAYLAND_DISPLAY:-}
  QT_X11_NO_MITSHM: "1"
  XAUTHORITY: /tmp/.container_xauth
  XDG_RUNTIME_DIR: /tmp/.container_xdg
  SYS_PYTHON_EXE: ${SYS_PYTHON_EXE:-/usr/bin/python3}
  UV_PYTHON: ${UV_PYTHON:-3.10}
  UV_EXTRA: ${UV_EXTRA:-}
  UV_SYNC_FLAGS: ${UV_SYNC_FLAGS:-}
  ROS_DISTRO: ${ROS_DISTRO:-humble}
  SYNC_TARGET_DIR: ${SYNC_TARGET_DIR:-src/thirdparty}
  DEVKIT_VCS_ALLOW_FAILURE: ${DEVKIT_VCS_ALLOW_FAILURE:-0}
  DEVKIT_ROSDEP_ALLOW_FAILURE: ${DEVKIT_ROSDEP_ALLOW_FAILURE:-0}
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
  RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
  ROS_MASTER_URI: ${ROS_MASTER_URI:-http://localhost:11311}
  ROS_HOSTNAME: ${ROS_HOSTNAME:-localhost}
  ROS_IP: ${ROS_IP:-}
  CMAKE_C_STANDARD: ${CMAKE_C_STANDARD:-11}
  CMAKE_CXX_STANDARD: ${CMAKE_CXX_STANDARD:-17}
  CMAKE_EXTRA_ARGS: ${CMAKE_EXTRA_ARGS:-}
  COLCON_EXTRA_FLAGS: ${COLCON_EXTRA_FLAGS:-}

x-nvidia-env: &nvidia-env
  <<: *common-env
  GPU_MODE: nvidia
  NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
  NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-all}
  LIBGL_ALWAYS_SOFTWARE: "0"

x-nvidia-deploy: &nvidia-deploy
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: ${NVIDIA_GPU_COUNT:-all}
          capabilities: [gpu, compute, utility, graphics, video]

# The healthchecks live in docker-compose.dev.yml, next to the services that
# select one: a YAML anchor cannot cross files, and the ENV split (ros vs dev)
# is already expressed there.

# ── Service Templates (Abstract Bases) ───────────────────────────────────────
# THREE templates, one per acceleration profile. There is no separate ROS
# template: the ROS and non-ROS services differ only by build target, command
# and healthcheck, all of which docker-compose.dev.yml already sets per ENV —
# six near-identical blocks here drifted instead (an env knob added to the dev
# five and missed on the ROS one is invisible until a container misbehaves).
services:
  # Core Configuration Base (also the plain-CPU profile)
  base-common:
    environment:
      <<: *common-env
    # The host wiring, once: check_env.sh resolves each source and substitutes a
    # .docker_cache placeholder where the host has none. `extends` APPENDS a
    # service's own volumes to these, so the ENV files add only their build
    # output — check [compose-env-split].
    volumes:
      - ${HOST_WORKSPACE_PATH:-.}:${WORKSPACE_PATH:-/workspace}:rw
      - ${HOST_X11_DIR:-/tmp/.X11-unix}:/tmp/.X11-unix:rw
      - ${HOST_XAUTHORITY:-/tmp/.container_xauth}:/tmp/.container_xauth:ro
      - ${HOST_XDG_RUNTIME_DIR:-/tmp/.container_xdg}:/tmp/.container_xdg:rw
      - ${GIT_CONFIG_PATH:-${HOST_GITCONFIG:-/dev/null}}:/home/${CONTAINER_USER:-user}/.gitconfig:ro
      - ${HOST_SSH_AUTH_SOCK:-/dev/null}:/tmp/ssh-auth.sock:ro
      - ${HOST_CACHE_DIR:-${HOST_WORKSPACE_PATH:-.}/.docker_cache}:/cache:rw
      - ${WSL_LIB_DIR_MOUNT:-/tmp}:/usr/lib/wsl:ro
    working_dir: ${WORKSPACE_PATH:-/workspace}
    platform: linux/${TARGETARCH:-amd64}
    profiles: [abstract]
    restart: unless-stopped
    tty: true
    stdin_open: true
    network_mode: ${NETWORK_MODE:-host}
    ipc: ${IPC_MODE:-host}
    privileged: ${PRIVILEGED:-false}
    ulimits:
      nofile:
        soft: ${ULIMIT_NOFILE:-65535}
        hard: ${ULIMIT_NOFILE:-65535}
    devices:
      - ${HOST_DXG_MOUNT:-/dev/null:/dev/null}
      - ${HOST_DRI_MOUNT:-/dev/null:/dev/null}
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        CONTAINER_USER: ${CONTAINER_USER:-user}
        USER_UID: ${HOST_UID:-1000}
        USER_GID: ${HOST_GID:-1000}
        DEBIAN_FRONTEND: ${DEBIAN_FRONTEND:-noninteractive}
        LANG: ${LANG:-C.UTF-8}
        TZ: ${TZ:-UTC}
        SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH:-}
        APT_SNAPSHOT_DATE: ${APT_SNAPSHOT_DATE:-latest}
        ROS_SNAPSHOT_DATE: ${ROS_SNAPSHOT_DATE:-latest}
        STRICT_GPG_CHECK: ${STRICT_GPG_CHECK:-true}
        WORKSPACE_PATH: ${WORKSPACE_PATH:-/workspace}
        UV_VERSION: ${UV_VERSION:-0.10.10}
        UV_PYTHON: ${UV_PYTHON:-3.10}
        UV_EXTRA: ${UV_EXTRA:-}
        CMAKE_C_STANDARD: ${CMAKE_C_STANDARD:-11}
        CMAKE_CXX_STANDARD: ${CMAKE_CXX_STANDARD:-17}
        BASE_IMAGE: ${BASE_IMAGE:-ubuntu:22.04}
        ROS_DISTRO: ${ROS_DISTRO:-humble}
        TARGETARCH: ${TARGETARCH:-amd64}
        UV_SYNC_FLAGS: ${UV_SYNC_FLAGS:-}
        CMAKE_EXTRA_ARGS: ${CMAKE_EXTRA_ARGS:-}
        COLCON_EXTRA_FLAGS: ${COLCON_EXTRA_FLAGS:-}
        FULL_CUDA: ${FULL_CUDA:-false}
        CUDA_VERSION: ${CUDA_VERSION:-}
        CUDNN_VERSION: ${CUDNN_VERSION:-}
        INSTALL_INTEL_GPU_TOOLS: ${INSTALL_INTEL_GPU_TOOLS:-false}

  # Integrated GPU (iGPU) Acceleration (Intel/AMD)
  base-igpu:
    profiles: [abstract]
    extends: base-common
    build:
      args:
        INSTALL_INTEL_GPU_TOOLS: "true"

  # NVIDIA Acceleration Template
  base-nvidia:
    profiles: [abstract]
    extends: base-common
    environment:
      <<: *nvidia-env
    runtime: nvidia
    deploy:
      <<: *nvidia-deploy
