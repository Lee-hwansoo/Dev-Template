# =============================================================================
# docker-compose.dev.yml — the concrete services: the ENV split (ros vs dev),
# the workspace bind mount, GUI forwarding and the per-ENV healthcheck.
# =============================================================================
include:
  - path: docker-compose.common.yml

# ── Build output volumes (one set per ENV) ───────────────────────────────────
# The host wiring lives in base-common and `extends` appends these to it, so the
# eight shared mounts are written once. Empty in .env = a named volume (isolated
# in Docker); a path = a bind mount onto the host.
x-dev-volumes: &dev-volumes
  - ${DEV_BUILD_VOL:-dev_build_data}:${WORKSPACE_PATH:-/workspace}/build
  - ${DEV_INSTALL_VOL:-dev_install_data}:${WORKSPACE_PATH:-/workspace}/install
  - ${DEV_LOG_VOL:-dev_log_data}:${WORKSPACE_PATH:-/workspace}/log

x-ros-volumes: &ros-volumes
  - ${ROS_BUILD_VOL:-ros_build_data}:${WORKSPACE_PATH:-/workspace}/build
  - ${ROS_INSTALL_VOL:-ros_install_data}:${WORKSPACE_PATH:-/workspace}/install
  - ${ROS_LOG_VOL:-ros_log_data}:${WORKSPACE_PATH:-/workspace}/log

# ── Healthchecks (one per ENV) ───────────────────────────────────────────────
# ROS: the DDS stack is only useful once the distro sourced, so probe that.
# Dev: pid 1 liveness — cheaper than any command, and 'echo alive' would pass
# in a container whose shell has already died.
x-ros-healthcheck: &ros-healthcheck
  test:
    [
      "CMD",
      "bash",
      "-c",
      ". /opt/ros/$${ROS_DISTRO}/setup.bash 2>/dev/null && (ros2 --help >/dev/null 2>&1 || roscore -h >/dev/null 2>&1)",
    ]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s

x-dev-healthcheck: &dev-healthcheck
  test: ["CMD-SHELL", "kill -0 1 2>/dev/null || exit 1"]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 10s

# SSH Agent Forwarding environment (shared across dev services)
x-ssh-agent-env: &ssh-agent-env
  SSH_AUTH_SOCK: ${HOST_SSH_AUTH_SOCK:+/tmp/ssh-auth.sock}

# ── Developer Service Shared Configuration (Target: dev) ─────────────────────
# `command: bash`, fixed: the dev container is the workspace, and APP_COMMAND /
# ROS_LAUNCH_COMMAND belong to the production entrypoint. Reading them here
# turned `make start` into a restart loop once .env carried one for bake-prod.
x-dev-shared: &dev-shared
  build:
    target: dev
  environment:
    <<: *ssh-agent-env
  volumes: *dev-volumes
  command: bash
  healthcheck: *dev-healthcheck

x-ros-dev-shared: &ros-dev-shared
  build:
    target: ros
  environment:
    <<: *ssh-agent-env
  volumes: *ros-volumes
  command: bash
  healthcheck: *ros-healthcheck

services:
  # [Pure Dev] Development Services
  basic-cpu:
    extends: { file: docker-compose.common.yml, service: base-common }
    <<: *dev-shared
    profiles: ["basic-cpu"]

  basic-igpu:
    extends: { file: docker-compose.common.yml, service: base-igpu }
    <<: *dev-shared
    profiles: ["basic-igpu"]

  basic-nvidia:
    extends: { file: docker-compose.common.yml, service: base-nvidia }
    <<: *dev-shared
    profiles: ["basic-nvidia"]

  # [ROS] Development Services (Default Entry Point)
  ros-cpu:
    extends: { file: docker-compose.common.yml, service: base-common }
    <<: *ros-dev-shared
    profiles: ["ros-cpu"]

  ros-igpu:
    extends: { file: docker-compose.common.yml, service: base-igpu }
    <<: *ros-dev-shared
    profiles: ["ros-igpu"]

  ros-nvidia:
    extends: { file: docker-compose.common.yml, service: base-nvidia }
    <<: *ros-dev-shared
    profiles: ["ros-nvidia"]

volumes:
  ros_build_data:
  ros_install_data:
  ros_log_data:
  dev_build_data:
  dev_install_data:
  dev_log_data:
