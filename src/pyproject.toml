[project]
name = "DevKit"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
cpu = [
    "torch==2.11.0; python_version >= '3.10'",
    "torchvision; python_version >= '3.10'",
]
gpu = [
    "torch==2.11.0; python_version >= '3.10'",
    "torchvision; python_version >= '3.10'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
# .editorconfig is the style SSOT (python: max_line_length = 100) and
# .vscode/settings.json draws a ruler there, but ruff reads neither — VS Code's
# format-on-save was wrapping at ruff's default 88. Kept here rather than in a
# ruff.toml so a derived project inherits it with the dependency manifest.
line-length = 100

[tool.ruff.lint]
# Declared, not inherited: ruff's default rule set changes between releases, so
# a fresh clone could go red on an upgrade that touched nothing here. E/F/I is
# the conservative floor — pycodestyle errors, pyflakes, import order. Add rule
# families (e.g. "B", "UP", "PL") as your project decides to enforce them.
select = ["E", "F", "I"]

[tool.uv]
conflicts = [
    [ { extra = "cpu" }, { extra = "gpu" } ]
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "gpu" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "gpu" },
]
